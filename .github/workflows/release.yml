# On a v* tag: publish the image to GHCR and attach the bare binary to the
# GitHub release.
#
# The binary is published as well as the image because it is the whole
# program -- one static file that needs nothing but an ffmpeg on PATH -- and
# somebody running this outside Docker should not have to build it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # to attach the binary to the release
  packages: write   # to push to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # The tests have already run on this commit via CI, but a tag is the
      # one build nobody gets to re-do, so they run again here.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: go test
        run: go test -race ./...

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only, deliberately. The encoders this exists to drive are
      # Intel QSV and VAAPI; an arm64 image would imply hardware transcoding
      # it cannot do. The Dockerfile refuses any other architecture outright.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=media-compressor
            org.opencontainers.image.description=Keeps a media library encoded as HEVC in MKV, without the junk tracks
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build the bare binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" \
            -o media-compressor-linux-amd64 ./cmd/media-compressor
          sha256sum media-compressor-linux-amd64 > media-compressor-linux-amd64.sha256

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || true
          gh release upload "$GITHUB_REF_NAME" \
            media-compressor-linux-amd64 \
            media-compressor-linux-amd64.sha256 \
            unraid/media-compressor.xml \
            --clobber
