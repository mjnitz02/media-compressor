---
# Every push and pull request: the checks that gate a merge to main.
#
# `test`, `lint`, `secrets` and `image` are the four required checks on the
# `main` ruleset, which is also what Dependabot auto-merge waits on. Anything
# added here that should block a merge has to be added to that ruleset too --
# a job that is merely present is not a gate.
#
# The image is built here as well as at release time because a broken
# Dockerfile found at release time is found at the worst possible moment.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A force-push or a quick second push should not leave two full runs racing;
# the image job in particular is several minutes of container work.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The encoder's and runner's tests work on clips they generate with
      # testsrc, so without ffmpeg they quietly skip themselves and the
      # interesting half of the suite does not run.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # -race because the runner is two worker pools and a daemon watching
      # them through a callback, which is where a data race would live.
      - name: go test
        run: go test -race ./...

  # Separate from `test` so a lint failure and a test failure are
  # distinguishable at a glance in the checks list, and so a slow lint run
  # never delays the test result.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # gitleaks scans history, not just the working tree

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan for leaked secrets
        run: gitleaks detect --config .gitleaks.toml --redact --no-banner -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: media-compressor:ci

      # Proves the three things the image exists to provide: the binary runs,
      # ffmpeg is on PATH, and it is one that can talk to an Intel GPU.
      - name: Check what is in it
        run: |
          docker run --rm media-compressor:ci version
          docker run --rm --entrypoint ffprobe media-compressor:ci -version | head -1
          docker run --rm --entrypoint ffmpeg media-compressor:ci -hide_banner -encoders \
            | grep -E 'hevc_vaapi|hevc_qsv'
          docker image ls media-compressor:ci --format 'image size: {{.Size}}'

      # PUID/PGID is the difference between a container that fits on a NAS and
      # one that leaves root-owned files across somebody's library, so it is
      # worth proving rather than assuming. Three observable effects: the
      # process really runs as the requested ids, /config ends up owned by
      # them, and leaving the variables unset still means root -- which is what
      # a plain `docker run` outside a NAS gets.
      - name: Prove the PUID/PGID drop
        run: |
          set -eu

          # `docker top` needs pid in the ps format or it cannot parse the
          # output at all ("Couldn't find PID field in ps output"). It reports
          # host-side ids, so this is the kernel's answer rather than the
          # container's own /etc/passwd agreeing with itself.
          uid_of() {
            for _ in $(seq 1 20); do
              u=$(docker top "$1" -o pid,uid,args 2>/dev/null \
                  | awk 'NR>1 && /media-compressor/ {print $2; exit}')
              if [ -n "${u:-}" ]; then echo "$u"; return 0; fi
              sleep 1
            done
            return 1
          }

          run_case() {
            label=$1; shift
            work=$(mktemp -d)
            mkdir -p "$work/config" "$work/temp" "$work/media"
            cp testdata/container-config.yaml "$work/config/config.yaml"
            cid=$(docker run -d "$@" \
              -v "$work/config":/config \
              -v "$work/temp":/temp \
              -v "$work/media":/media \
              media-compressor:ci daemon)
            if ! CASE_UID=$(uid_of "$cid"); then
              echo "$label: the daemon never came up" >&2
              docker logs "$cid" >&2 || true
              docker rm -f "$cid" >/dev/null 2>&1 || true
              exit 1
            fi
            CASE_OWNER=$(stat -c '%u:%g' "$work/config")
            docker rm -f "$cid" >/dev/null 2>&1 || true
            echo "$label: uid $CASE_UID, /config owned by $CASE_OWNER"
          }

          run_case "PUID=99 PGID=100" -e PUID=99 -e PGID=100
          [ "$CASE_UID" = "99" ] || { echo "expected uid 99, got $CASE_UID" >&2; exit 1; }
          [ "$CASE_OWNER" = "99:100" ] || { echo "expected /config chowned to 99:100, got $CASE_OWNER" >&2; exit 1; }

          run_case "PUID unset"
          [ "$CASE_UID" = "0" ] || { echo "expected root with PUID unset, got $CASE_UID" >&2; exit 1; }

      # group_add is how a render node that is not world-readable gets reached,
      # and a plain --clear-groups across the drop would throw it away
      # silently -- the failure would only show up as every encode failing on a
      # machine nobody is watching.
      - name: Supplementary groups survive the drop
        run: |
          set -eu
          work=$(mktemp -d)
          mkdir -p "$work/config" "$work/temp" "$work/media"
          cp testdata/container-config.yaml "$work/config/config.yaml"
          cid=$(docker run -d -e PUID=99 -e PGID=100 --group-add 44 --group-add 18 \
            -v "$work/config":/config -v "$work/temp":/temp -v "$work/media":/media \
            media-compressor:ci daemon)
          sleep 5
          groups=$(docker exec "$cid" sh -c 'grep ^Groups: /proc/1/status' | cut -f2-)
          docker rm -f "$cid" >/dev/null 2>&1 || true
          echo "pid 1 supplementary groups: $groups"
          case " $groups " in
            *" 18 "*) ;; *) echo "gid 18 was dropped" >&2; exit 1 ;;
          esac
          case " $groups " in
            *" 44 "*) ;; *) echo "gid 44 was dropped" >&2; exit 1 ;;
          esac

      # The daemon must not exit when its configuration is missing. Exiting puts
      # the container into Docker's restart backoff, which reaches a minute --
      # so the log goes stale exactly when the operator is fixing the problem,
      # and a correct fix looks like it did nothing. That cost real confusion on
      # the first deployment. Proved against the image because the entrypoint's
      # bail-out is half of the behaviour.
      - name: A daemon with no config waits, and starts when one appears
        run: |
          set -eu
          work=$(mktemp -d)
          mkdir -p "$work/config" "$work/temp" "$work/media"

          cid=$(docker run -d -p 18080:8080 \
            -v "$work/config":/config \
            -v "$work/temp":/temp \
            -v "$work/media":/media \
            media-compressor:ci daemon)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT

          sleep 5
          running=$(docker inspect -f '{{.State.Running}}' "$cid")
          if [ "$running" != "true" ]; then
            echo "the daemon exited instead of waiting for a config" >&2
            docker logs "$cid" >&2
            exit 1
          fi

          # 503, not "ok": unconfigured is not healthy, and a passing check here
          # would report a working service that is encoding nothing.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz || true)
          [ "$code" = "503" ] || { echo "healthz was $code, want 503 while unconfigured" >&2; exit 1; }

          curl -s http://127.0.0.1:18080/ | grep -q "Waiting for a configuration" ||
            { echo "the holding page did not say what was missing" >&2; exit 1; }

          # The point of the whole thing: it picks the file up in place.
          cp testdata/container-config.yaml "$work/config/config.yaml"
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/healthz || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "healthz was $code; the config was never picked up" >&2
            docker logs "$cid" >&2
            exit 1
          fi

          restarts=$(docker inspect -f '{{.RestartCount}}' "$cid")
          [ "$restarts" = "0" ] ||
            { echo "it restarted $restarts times; it was meant to start in place" >&2; exit 1; }

          echo "waited, then started in place with no restart"
