version: 2
updates:
  # 1. Go Modules Configuration
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"             # Run every Monday
      time: "09:00"             # Run at 9:00 AM UTC
      timezone: "America/New_York"

    # Set the maximum number of open version update PRs at any time
    open-pull-requests-limit: 5

    # Automatically assign labels to the created PRs
    labels:
      - "dependencies"
      - "go"

    # Group related dependencies to avoid PR fatigue
    groups:
      # Combine all golang.org/x/* package updates into one PR
      golang-x-packages:
        patterns:
          - "golang.org/x/*"
      # Combine all AWS SDK updates into one PR
      aws-sdk-go:
        patterns:
          - "://github.com*"

  # 2. GitHub Actions Configuration (Optional but recommended)
  # Keeps your CI/CD workflow dependencies up-to-date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
